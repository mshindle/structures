name: Go Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Testing across OSs helps catch race conditions and platform-specific bugs
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.26.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          # Automatically caches and restores Go modules and build outputs
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Tests
        # The -race flag is critical for a thread-safe library
        run: go test -v -race ./...